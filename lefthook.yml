pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,tsx,json,md,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,ts,tsx}"
      run: bunx oxlint --deny-warnings {staged_files}

commit-msg:
  commands:
    conventional-commits:
      run: >-
        head -n 1 {1} | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/-]+\))?!?: .+|Merge .+|Revert .+)$'
        || { echo 'Use Conventional Commits, e.g. "fix(client): retry failed fields together"'; exit 1; }

pre-push:
  commands:
    check:
      run: bun run typecheck && bun test
