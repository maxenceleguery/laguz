name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'maxenceleguery/laguz'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version commits and tags
      pull-requests: write # the "Version Packages" pull request
      id-token: write # npm trusted publishing and provenance
    steps:
      # The version pull request is opened and updated with RELEASE_TOKEN, a
      # fine-grained token (Contents and Pull requests: read and write, this
      # repository only). Pull requests opened with the built-in token get CI
      # runs that wait for manual approval, which blocks the required checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing (11.5.1 or later)
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: bunx changeset version
          publish-script: bun run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
