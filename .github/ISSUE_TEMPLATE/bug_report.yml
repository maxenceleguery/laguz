name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal repository, a failing test, or the smallest code that shows the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "@laguzjs/client, @laguzjs/server, React, graphql, runtime (Node/Bun/Deno/browser)"
    validations:
      required: true
